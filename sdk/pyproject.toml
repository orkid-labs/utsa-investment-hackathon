[project]
name = "statevector"
version = "0.1.0"
description = "Contestant SDK for the Equity Composite State Vector dataset"
requires-python = ">=3.10"
dependencies = [
    "polars>=1.0",
    "pyarrow>=14.0",
    "pandas>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
serve = ["fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
svq = "statevector.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["statevector*"]
